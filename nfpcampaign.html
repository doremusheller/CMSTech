<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign | Drumma's Yutes Foundation</title><style>
:root{--night:#05060b;--panel:#10121b;--panel2:#171923;--copper:#d87927;--gold:#f2bd6c;--cream:#f6ead9;--muted:#a99e92;--line:#3a2b20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#241509 0,transparent 34rem),var(--night);color:var(--cream);font:15px Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid #3a2417;background:#05060be8;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px)}a{color:var(--gold)}.logo{font:600 1.2rem Georgia,serif;text-decoration:none}.back{text-transform:uppercase;letter-spacing:.12em;font-size:12px}main{max-width:1100px;margin:auto;padding:44px clamp(18px,5vw,72px) 70px}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font:500 clamp(3rem,7vw,6rem)/.9 Georgia,serif;letter-spacing:-.08em;margin:16px 0}h1 span{color:var(--copper)}.intro{color:var(--muted);font-size:1.08rem;line-height:1.7;max-width:760px}.panel{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:16px}.panel h2{font:500 1.45rem Georgia,serif;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:8px;padding:14px}.stat strong{display:block;color:var(--gold);font-size:1.45rem}.stat small{display:block;color:var(--muted);margin-top:6px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;color:var(--muted)}.meta strong{display:block;color:var(--cream);margin-bottom:4px}.button{display:inline-block;border:1px solid var(--copper);border-radius:6px;background:#21130d;padding:11px 15px;text-decoration:none;font-weight:800}.foot{color:#897b6d;text-align:center;font-size:11px;margin-top:32px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr 1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}
</style></head><body><header><a class="logo" href="nfpdash.html">Drumma's Yutes</a><a class="back" href="nfpdash.html">← Mission Control</a></header><main id="app"><p>Loading campaign…</p></main><div class="foot">Drumma's Yutes Foundation · Campaign operations · Fictional demonstration data</div><script>
(()=>{const id=new URLSearchParams(location.search).get("campaign"),key="drummasYutesDemoWorkbook";let b={};try{b=JSON.parse(sessionStorage.getItem(key)||"{}")}catch(e){}const c=(Array.isArray(b.Campaigns)?b.Campaigns:[]).find(x=>x.CampaignID===id),app=document.getElementById("app");if(!c){app.innerHTML='<p>Campaign not found in this demo session.</p><a class="button" href="nfpdash.html">Return to Mission Control</a>';return}document.title=c.CampaignName+" | Drumma's Yutes Foundation";app.innerHTML='<div class="eyebrow">'+c.CampaignType+' · '+c.Status+'</div><h1>'+c.CampaignName+'<br><span>in motion.</span></h1><p class="intro">'+(c.Purpose||"Campaign purpose not yet recorded.")+'</p><section class="stats"><div class="stat"><strong>$'+Number(c.FundraisingGoal||0).toLocaleString()+'</strong><small>Fundraising goal</small></div><div class="stat"><strong>0%</strong><small>Gift progress · awaiting gifts</small></div><div class="stat"><strong>'+c.Audience+'</strong><small>Audience</small></div><div class="stat"><strong>'+c.ProgramName+'</strong><small>Linked initiative</small></div></section><section class="panel"><h2>Campaign brief</h2><div class="meta"><div><strong>Owner</strong>'+c.CampaignOwner||"Unassigned"+'</div><div><strong>Start</strong>'+c.StartDate+'</div><div><strong>End</strong>'+c.EndDate+'</div><div><strong>Headline</strong>'+c.Headline||"Not yet written"+'</div><div><strong>Call to action</strong>'+c.CallToAction||"Not yet written"+'</div><div><strong>Notes</strong>'+c.Notes||"No notes recorded."+ '</div></div></section><section class="panel"><h2>Next connection</h2><p class="intro">This campaign is linked to '+c.ProgramName+'. Future campaign gifts will retain CampaignID '+c.CampaignID+' for live progress tracking.</p><a class="button" href="nfpinitiative.html?program='+encodeURIComponent(c.ProgramID)+'">Open linked initiative</a></section>';})();
</script></body></html>
