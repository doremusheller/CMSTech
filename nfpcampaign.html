<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign | Drumma's Yutes Foundation</title><style>
:root{--night:#05060b;--panel:#10121b;--panel2:#171923;--copper:#d87927;--gold:#f2bd6c;--cream:#f6ead9;--muted:#a99e92;--line:#3a2b20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#241509 0,transparent 34rem),var(--night);color:var(--cream);font:15px Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid #3a2417;background:#05060be8;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px)}a{color:var(--gold)}.logo{font:600 1.2rem Georgia,serif;text-decoration:none}.back{text-transform:uppercase;letter-spacing:.12em;font-size:12px}main{max-width:1100px;margin:auto;padding:44px clamp(18px,5vw,72px) 70px}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font:500 clamp(3rem,7vw,6rem)/.9 Georgia,serif;letter-spacing:-.08em;margin:16px 0}h1 span{color:var(--copper)}.intro{color:var(--muted);font-size:1.08rem;line-height:1.7;max-width:760px}.panel{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:16px}.panel h2{font:500 1.45rem Georgia,serif;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:8px;padding:14px}.stat strong{display:block;color:var(--gold);font-size:1.45rem}.stat small{display:block;color:var(--muted);margin-top:6px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;color:var(--muted)}.meta strong{display:block;color:var(--cream);margin-bottom:4px}.button{display:inline-block;border:1px solid var(--copper);border-radius:6px;background:#21130d;padding:11px 15px;text-decoration:none;font-weight:800}.foot{color:#897b6d;text-align:center;font-size:11px;margin-top:32px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr 1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}
</style><style id="campaign-operations-style">
.workGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actionRow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.fieldLabel{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:12px 0}.fieldLabel select{display:block;width:100%;margin-top:6px;padding:11px;background:#0d0e15;color:var(--cream);border:1px solid var(--line);border-radius:6px}.recordList{display:grid;gap:8px}.record{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:7px;padding:11px;background:#15131a}.record strong{color:var(--gold)}.record span{color:var(--muted);text-align:right}.donorLink{text-decoration:none;color:var(--cream)}.donorLink:hover{border-color:var(--copper)}.muted{color:var(--muted)}#campaignModal[hidden]{display:none}#campaignModal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#000b}.modalCard{width:min(520px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--panel);border:1px solid var(--copper);border-radius:10px;padding:22px}.modalCard h2{font:500 1.6rem Georgia,serif;margin:0 0 16px}.modalCard label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:12px 0}.modalCard input,.modalCard select,.modalCard textarea{display:block;width:100%;margin-top:6px;padding:11px;background:#0d0e15;color:var(--cream);border:1px solid var(--line);border-radius:6px;font:inherit}.modalCard textarea{min-height:82px}.modalActions{display:flex;gap:8px;margin-top:16px}.modalActions .button{cursor:pointer}@media(max-width:700px){.workGrid{grid-template-columns:1fr}.record{display:block}.record span{display:block;text-align:left;margin-top:5px}}
</style><style id="campaign-button-polish">
.button{color:var(--gold);font:800 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .18s,border-color .18s,color .18s}.button:hover{background:#342014;border-color:var(--gold);color:var(--cream)}button.button{appearance:none}.actionRow .button{min-height:44px}.modalActions .button{min-height:42px}
</style></head><body><header><a class="logo" href="nfpdash.html">Drumma's Yutes</a><a class="back" href="nfpdash.html">← Mission Control</a></header><main id="app"><p>Loading campaign…</p></main><div class="foot">Drumma's Yutes Foundation · Campaign operations · Fictional demonstration data</div><script>
(()=>{const key="drummasYutesDemoWorkbook",id=new URLSearchParams(location.search).get("campaign"),app=document.getElementById("app"),read=()=>{try{return JSON.parse(sessionStorage.getItem(key)||"{}")}catch(e){return{}}},write=b=>sessionStorage.setItem(key,JSON.stringify(b)),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),today=new Date().toISOString().slice(0,10);let book=read(),campaigns=Array.isArray(book.Campaigns)?book.Campaigns:[],campaign=campaigns.find(x=>x.CampaignID===id);
if(!campaign){app.innerHTML='<p>Campaign not found in this demo session.</p><a class="button" href="nfpdash.html">Return to Mission Control</a>';return}
const gifts=Array.isArray(book.Gifts)?book.Gifts:[],campaignGifts=()=>gifts.filter(g=>g.CampaignID===campaign.CampaignID),metrics=()=>{const rows=campaignGifts(),raised=rows.reduce((s,g)=>s+Number(g.Amount||0),0),donors=new Set(rows.map(g=>g.DonorID).filter(Boolean));return{rows,raised,donors}};document.title=campaign.CampaignName+" | Drumma's Yutes Foundation";
function render(){book=read();campaign=(Array.isArray(book.Campaigns)?book.Campaigns:[]).find(x=>x.CampaignID===id)||campaign;const m=metrics(),goal=Number(campaign.FundraisingGoal||0),pct=goal?Math.min(100,m.raised/goal*100):0;app.innerHTML='<div class="eyebrow">'+esc(campaign.CampaignType)+' · '+esc(campaign.Status)+'</div><h1>'+esc(campaign.CampaignName)+'<br><span>in motion.</span></h1><p class="intro">'+esc(campaign.Purpose||"Campaign purpose not yet recorded.")+'</p><section class="stats"><div class="stat"><strong>$'+goal.toLocaleString()+'</strong><small>Fundraising goal</small></div><div class="stat"><strong>$'+m.raised.toLocaleString()+'</strong><small>Raised to date</small></div><div class="stat"><strong>'+pct.toFixed(1)+'%</strong><small>Goal completion</small></div><div class="stat"><strong>'+m.rows.length+'</strong><small>Gift records</small></div><div class="stat"><strong>'+m.donors.size+'</strong><small>Participating donors</small></div><div class="stat"><strong>$'+(m.rows.length?Math.round(m.raised/m.rows.length):0).toLocaleString()+'</strong><small>Average gift</small></div></section><section class="panel"><h2>Campaign brief</h2><div class="meta"><div><strong>Owner</strong>'+esc(campaign.CampaignOwner||"Unassigned")+'</div><div><strong>Audience</strong>'+esc(campaign.Audience||"Not specified")+'</div><div><strong>Linked initiative</strong>'+esc(campaign.ProgramName||"—")+'</div><div><strong>Start</strong>'+esc(campaign.StartDate)+'</div><div><strong>End</strong>'+esc(campaign.EndDate)+'</div><div><strong>Headline</strong>'+esc(campaign.Headline||"Not yet written")+'</div><div><strong>Call to action</strong>'+esc(campaign.CallToAction||"Not yet written")+'</div><div><strong>Notes</strong>'+esc(campaign.Notes||"No notes recorded.")+'</div></div></section><section class="workGrid"><section class="panel"><h2>Campaign actions</h2><div class="actionRow"><button class="button" id="addCampaignGift">＋ Add campaign gift</button><button class="button" id="addCampaignActivity">＋ Log activity</button></div><label class="fieldLabel">Campaign status<select id="campaignStatus"><option>Planning</option><option>Active</option><option>Paused</option><option>Complete</option></select></label><button class="button" id="saveStatus">Save status</button><a class="button" href="nfpdonors.html?program='+encodeURIComponent(campaign.ProgramID||"")+'&name='+encodeURIComponent(campaign.ProgramName||"")+'">View initiative donors</a></section><section class="panel"><h2>Recent campaign gifts</h2><div class="recordList">'+(m.rows.length?m.rows.slice().reverse().map(g=>'<div class="record"><strong>$'+Number(g.Amount||0).toLocaleString()+'</strong><span>'+esc(g.GiftDate)+' · '+esc(g.DonorID)+'<br>'+esc(g.Notes||"No note entered.")+'</span></div>').join(""):'<p class="muted">No campaign-linked gifts yet.</p>')+'</div></section></section><section class="panel"><h2>Campaign activity</h2><div id="activityList" class="recordList">'+((campaign.Activities||[]).length?campaign.Activities.slice().reverse().map(a=>'<div class="record"><strong>'+esc(a.Type)+'</strong><span>'+esc(a.Date)+' · '+esc(a.Note)+'</span></div>').join(""):'<p class="muted">No campaign activity logged yet.</p>')+'</div></section><section class="panel"><h2>Participating donors</h2><div class="recordList">'+(m.donors.size?[...m.donors].map(d=>'<a class="record donorLink" href="nfpdonors.html?donor='+encodeURIComponent(d)+'#'+encodeURIComponent(d)+'"><strong>'+esc(d)+'</strong><span>Open donor record →</span></a>').join(""):'<p class="muted">No participating donors yet.</p>')+'</div></section><div id="campaignModal" hidden></div>';
const status=document.getElementById("campaignStatus");status.value=campaign.Status||"Planning";document.getElementById("saveStatus").onclick=()=>{const b=read(),row=b.Campaigns.find(x=>x.CampaignID===id);if(row){row.Status=status.value;write(b);render()}};document.getElementById("addCampaignGift").onclick=()=>giftModal();document.getElementById("addCampaignActivity").onclick=()=>activityModal()}
function overlay(inner){const m=document.getElementById("campaignModal");m.innerHTML='<form class="modalCard">'+inner+'</form>';m.hidden=false;m.onclick=e=>{if(e.target===m)m.hidden=true};return m}
function giftModal(){const m=overlay('<h2>Add campaign gift</h2><label>Donor ID<input id="cgDonor" required placeholder="DON-000001"></label><label>Gift date<input id="cgDate" type="date" value="'+today+'" required></label><label>Amount<input id="cgAmount" type="number" min="1" required placeholder="500"></label><label>Note<textarea id="cgNote" placeholder="Gift context or acknowledgment note"></textarea><div class="modalActions"><button type="button" class="button" id="closeM">Cancel</button><button class="button" type="submit">Save gift</button></div>');m.querySelector("#closeM").onclick=()=>m.hidden=true;m.querySelector("form").onsubmit=e=>{e.preventDefault();const b=read();b.Gifts=Array.isArray(b.Gifts)?b.Gifts:[];b.Gifts.push({GiftID:"DEMO-GFT-"+Date.now(),DonorID:document.getElementById("cgDonor").value.trim(),GiftDate:document.getElementById("cgDate").value,Amount:Number(document.getElementById("cgAmount").value),ProgramID:campaign.ProgramID,ProgramName:campaign.ProgramName,CampaignID:campaign.CampaignID,CampaignName:campaign.CampaignName,Notes:document.getElementById("cgNote").value.trim()||"No note entered."});write(b);m.hidden=true;render()}}
function activityModal(){const m=overlay('<h2>Log campaign activity</h2><label>Activity type<select id="caType"><option>Email appeal</option><option>Major donor call</option><option>Event</option><option>Thank-you</option><option>Results review</option></select></label><label>Date<input id="caDate" type="date" value="'+today+'" required></label><label>Note<textarea id="caNote" required placeholder="What happened, and what comes next?"></textarea><div class="modalActions"><button type="button" class="button" id="closeM">Cancel</button><button class="button" type="submit">Save activity</button></div>');m.querySelector("#closeM").onclick=()=>m.hidden=true;m.querySelector("form").onsubmit=e=>{e.preventDefault();const b=read(),row=b.Campaigns.find(x=>x.CampaignID===id);row.Activities=Array.isArray(row.Activities)?row.Activities:[];row.Activities.push({Type:document.getElementById("caType").value,Date:document.getElementById("caDate").value,Note:document.getElementById("caNote").value.trim()});write(b);m.hidden=true;render()}}
render();
})();
</script></body></html>
